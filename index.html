<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>藏著 吉他副歌試唱</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111827;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        color: white;
    }

    .player {
        width: 90%;
        max-width: 500px;
        text-align: center;
        padding: 40px 25px;
        box-sizing: border-box;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 30px;
        font-weight: normal;
    }

    audio {
        width: 100%;
    }

    .artist {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.6;
    }

    /* 下載按鈕樣式 */
    .download-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 25px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .download-btn:hover {
        background: #1d4ed8;
    }
</style>
</head>

<body>

<div class="player">

    <h1 id="songTitle">藏著</h1>

    <audio controls id="musicPlayer">
        您的瀏覽器不支援音樂播放。
    </audio>

    <div class="artist" id="songSubtitle">
        吉他副歌試唱
    </div>

    <a
        class="download-btn"
        id="downloadButton"
        href="#"
        download
    >
        ⬇ 下載音樂 MP3
    </a>

</div>

<script>

    // ==================================
    // 以後更換歌曲，只需要修改這裡！
    // ==================================

    const musicFile = "藏著 吉他試唱.MP3";

    const songTitle = "藏著";

    const songSubtitle = "吉他副歌試唱";

    const downloadFileName = "藏著.mp3";

    // ==================================
    // 以下程式碼不需要修改
    // ==================================

    // 自動轉換中文及空格為網址編碼
    const encodedFileName = encodeURIComponent(musicFile);

    // 自動組合 GitHub 音檔網址
    const musicUrl =
        "https://raw.githubusercontent.com/Orange0609/hide-sing/main/"
        + encodedFileName;

    // 設定歌曲標題
    document.getElementById("songTitle").textContent = songTitle;

    // 設定歌曲副標題
    document.getElementById("songSubtitle").textContent = songSubtitle;

    // 設定播放器音檔
    document.getElementById("musicPlayer").src = musicUrl;

    // 設定下載按鈕
    const downloadButton = document.getElementById("downloadButton");

    downloadButton.href = musicUrl;

    downloadButton.download = downloadFileName;

</script>

</body>
</html>
